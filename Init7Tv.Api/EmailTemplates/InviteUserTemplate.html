<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='UTF-8'>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 16px;
            color: #333;
            margin-top: 10px;
            margin-bottom: 10px
        }

        p {
            font-size: 14px;
            color: #555;
        }

        .footer {
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class='container'>
    <h1>@Title</h1>
    <p>You were invited to use Init7Tv</p>
    <p>You can set your password here and start watching:</p>
    <a href="@SetPasswordUrl">Set password</a>
    <h2>Init7Tv</h2>
    <p class='footer'>© 2026 Init7Tv</p>
</div>
</body>
</html>
