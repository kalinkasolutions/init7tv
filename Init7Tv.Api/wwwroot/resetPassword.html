<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Init7TV</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<main>
    <h1>Reset password</h1>
    <form action="/reset-password" method="POST">
        <input type="hidden" name="email" id="email-hidden">
        <input type="hidden" name="token" id="token-hidden">
        
        <label for="password"></label>
        <input id="password" name="password" autofocus placeholder="password" type="password"/>
        <button type="submit">Reset</button>
    </form>
</main>
<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("email-hidden").value = params.get("email");
    document.getElementById("token-hidden").value = params.get("token");
</script>
</body>
</html>
