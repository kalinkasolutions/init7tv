<div id="dashboard" x-data="dashboardView()">
    <h2>Current streams</h2>
    <template x-if="streams.length">
        <ul>
            <template x-for="stream in streams" :key="`${stream.channelId}_${stream.language}`">
                <li>
                    <div class="dashcard-title">
                        <img alt="" :src="`data:image/png;base64,${stream.channelLogo}`">
                        <h3 x-text="`${stream.channelDisplayName} (${stream.language})`"></h3>
                    </div>

                    <div class="dashcard-label">Watching</div>
                    <div class="dashcard-people" x-text="stream.userNames.join(', ')"></div>
                </li>
            </template>
        </ul>
    </template>
    <h3 x-show="!streams.length" x-cloak>Nobody is watching.</h3>

    <h2>Current recordings</h2>
    <template x-if="recordings.length">
        <ul>
            <template x-for="recording in recordings" :key="recording.recordingId">
                <li class="recording">
                    <div class="dashcard-title">
                        <img alt="" :src="`data:image/png;base64,${recording.channelLogo}`">
                        <h3 x-text="recording.channelDisplayName"></h3>
                    </div>

                    <div class="dashcard-what">
                        <h4 x-text="recording.title"></h4>
                        <span class="dashcard-sub" x-show="recording.subTitle"
                              x-text="recording.subTitle"></span>
                    </div>

                    <div class="dashcard-progress">
                        <div class="dashcard-bar">
                            <span :style="`width: ${percent(recording)}%`"></span>
                        </div>
                        <div class="dashcard-note">
                            <span x-text="elapsed(recording)"></span>
                            <span x-text="`until ${until(recording)}`"></span>
                        </div>
                    </div>

                    <div class="dashcard-label">Recording for</div>
                    <div class="dashcard-people" x-text="recording.userNames.join(', ')"></div>
                </li>
            </template>
        </ul>
    </template>
    <h3 x-show="!recordings.length" x-cloak>Nothing is recording.</h3>
</div>
