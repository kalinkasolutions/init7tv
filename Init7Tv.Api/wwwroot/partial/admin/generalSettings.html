<div id="app-settings" class="box" x-data="generalSettingsView()">
    <h2>General Settings</h2>
    <div class="form-group">
        <label for="base-domain"></label>
        <input id="base-domain" placeholder="base domain: https://tv.example.org" type="text"
               x-model="appSettings.baseDomain"/>
    </div>

    <div class="form-group">
        <label for="ffmpeg-preset">FFmpeg Preset:</label>
        <select id="ffmpeg-preset" x-model="appSettings.ffmpegPreset">
            <option value="ultrafast">ultrafast</option>
            <option value="superfast">superfast</option>
            <option value="veryfast">veryfast</option>
            <option value="faster">faster</option>
            <option value="fast">fast</option>
            <option value="medium">medium</option>
            <option value="slow">slow</option>
            <option value="slower">slower</option>
            <option value="veryslow">veryslow</option>
            <option value="placebo">placebo</option>
        </select>
    </div>

    <div class="form-group">
        <label for="ffmpeg-deinterlace">Deinterlace (interlaced channels only):</label>
        <select id="ffmpeg-deinterlace" x-model="appSettings.ffmpegDeinterlaceMode">
            <option value="send_field">send_field - 50fps, one frame per field</option>
            <option value="send_frame">send_frame - 25fps, one frame per frame</option>
        </select>
    </div>

    <div class="form-group">
        <label for="ffmpeg-loglevel">FFmpeg Log Level:</label>
        <select id="ffmpeg-loglevel" x-model="appSettings.ffmpegLogLevel">
            <option value="quiet">quiet</option>
            <option value="panic">panic</option>
            <option value="fatal">fatal</option>
            <option value="error">error</option>
            <option value="warning">warning</option>
            <option value="info">info</option>
            <option value="verbose">verbose</option>
            <option value="debug">debug</option>
            <option value="trace">trace</option>
        </select>
    </div>

    <div class="actions">
        <button class="icon-button" @click="await update()" :disabled="saving"><i class="bi bi-check-lg"></i></button>
    </div>
</div>
