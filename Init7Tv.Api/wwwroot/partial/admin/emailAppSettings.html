<div id="app-settings" class="box" x-data="emailAppSettingsView()">
    <h2>Email Settings</h2>
    <div class="form-group">
        <label for="email-from"></label>
        <input id="email-from" placeholder="email from" type="email" x-model="appSettings.emailFrom"/>
    </div>

    <div class="form-group">
        <label for="smtp-host"></label>
        <input id="smtp-host" placeholder="SMTP host" type="text" x-model="appSettings.smtpHost"/>
    </div>

    <div class="form-group">
        <label for="port"></label>
        <input id="port" placeholder="port" type="number" x-model="appSettings.port"/>
    </div>

    <div class="form-group">
        <label for="user-name"></label>
        <input id="user-name" placeholder="username" type="text" x-model="appSettings.username"/>
    </div>

    <div class="form-group">
        <label for="password"></label>
        <input id="password" placeholder="password" type="password" x-model="appSettings.password"/>
    </div>

    <div class="form-group checkbox">
        <label for="enable-ssl">Enable SSL </label>
        <input id="enable-ssl" type="checkbox" x-model="appSettings.enableSsl"/>
    </div>

    <div class="form-group">
        <label for="secure-socket-options">Secure Socket Option:</label>
        <select id="secure-socket-options" x-model.number="appSettings.secureSocketOptions">
            <option value="0">None</option>
            <option value="1">Auto</option>
            <option value="2">Ssl on connect</option>
            <option value="3">Start Tls</option>
            <option value="4">Start Tls when available</option>
        </select>
    </div>
    <div class="actions">
        <button title="test email settings" class="icon-button" @click="await sendTestMail()"
                :disabled="sendingTestMail"><i
                class="bi bi-envelope"></i>
        </button>
        <button class="icon-button" @click="await update()" :disabled="saving"><i class="bi bi-check-lg"></i></button>
    </div>
</div>
