<header x-data="headerView()">
    <h1>init7Tv</h1>
    <ul>
        <li>
            <a href="#tv" @click.prevent="$store.view.show('tv')"
               :class="{ 'active': $store.view.is('tv') }">tv</a>
        </li>
        <template x-if="canRecord">
            <li>
                <a href="#recording" @click.prevent="$store.view.show('recording')"
                   :class="{ 'active': $store.view.is('recording') }">recording</a>
            </li>
        </template>
        <template x-if="userInfo?.isAdmin">
            <li>
                <a href="/admin.html" :class="{ 'active': location.pathname === '/admin.html' }">admin</a>
            </li>
        </template>
        <template x-if="userInfo?.isAdmin">
            <li>
                <a href="/dashboard.html" :class="{ 'active': location.pathname === '/dashboard.html' }">dashboard</a>
            </li>
        </template>
        <li>
            <form action="/logout" method="post">
                <button class="link-button" type="submit">logout</button>
            </form>
        </li>
    </ul>
</header>
