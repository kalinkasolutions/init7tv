<header x-data="headerView()">
    <h1>init7Tv</h1>
    <ul>
        <li>
            <!-- a plain link: from this page the browser only changes the fragment, and from the
                 admin or dashboard pages it comes back here -->
            <a href="/#tv" :class="{ 'active': is('tv') }">tv</a>
        </li>
        <template x-if="canRecord">
            <li>
                <a href="/#recording" :class="{ 'active': is('recording') }">recording</a>
            </li>
        </template>
        <template x-if="userInfo?.isAdmin">
            <li>
                <a href="/#admin" :class="{ 'active': is('admin') }">admin</a>
            </li>
        </template>
        <template x-if="userInfo?.isAdmin">
            <li>
                <a href="/#dashboard" :class="{ 'active': is('dashboard') }">dashboard</a>
            </li>
        </template>
        <li>
            <form action="/logout" method="post">
                <button class="link-button" type="submit">logout</button>
            </form>
        </li>
    </ul>
</header>
