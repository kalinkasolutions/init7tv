<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Init7TV</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/bundle.css">
</head>
<body>

<div x-init="$el.outerHTML = await loadPartialView('partial/header.html')"></div>

<main>
    <!-- the channel list is shared, so it is built once and stays put -->
    <div x-init="$el.outerHTML = await loadPartialView('partial/tv/sidebar.html')"></div>

    <!-- x-data because Alpine only looks at directives inside a component, and these two carry
         nothing of their own beyond being shown or not -->
    <div class="stream-content" x-data x-show="$store.view.is('tv')">
        <div x-init="$el.outerHTML = await loadPartialView('partial/tv/player.html')"></div>
        <div x-init="$el.outerHTML = await loadPartialView('partial/tv/epg.html')"></div>
    </div>

    <div class="stream-content" x-data x-show="$store.view.is('recording')" x-cloak>
        <div x-init="$el.outerHTML = await loadPartialView('partial/recording/recording.html')"></div>
    </div>
</main>

<div x-init="$el.outerHTML = await loadPartialView('partial/modal.html')"></div>
<div x-init="$el.outerHTML = await loadPartialView('partial/notification.html')"></div>

<script type="module" src="js/index.js"></script>

</body>
</html>
