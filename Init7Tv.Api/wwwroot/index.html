<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Init7TV</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/bundle.css">
</head>
<body>

<!-- one document: the header is built once and every view happens underneath it -->
<div x-init="$el.outerHTML = await loadPartialView('partial/header.html')"></div>

<main>
    <!-- the channel list belongs to watching and recording, and is shared by them -->
    <div x-show="$store.view.is('tv') || $store.view.is('recording')" x-data
         x-init="$el.innerHTML = await loadPartialView('partial/tv/sidebar.html')"></div>

    <div class="stream-content" x-data x-show="$store.view.is('tv')">
        <div x-init="$el.outerHTML = await loadPartialView('partial/tv/player.html')"></div>
        <div x-init="$el.outerHTML = await loadPartialView('partial/tv/epg.html')"></div>
    </div>

    <div class="stream-content" x-data x-show="$store.view.is('recording')" x-cloak>
        <div x-init="$el.outerHTML = await loadPartialView('partial/recording/recording.html')"></div>
    </div>

    <!-- built the first time somebody goes there, so a viewer who never does never asks for any
         of it, and the dashboard's connection is not opened on their behalf -->
    <div class="page" x-data="lazyView('admin', 'partial/admin/admin.html')"
         x-show="$store.view.is('admin')" x-cloak></div>

    <div class="page" x-show="$store.view.is('dashboard')" x-cloak
         x-data="lazyView('dashboard', 'partial/dashboard/dashboard.html',
                          'https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js')"></div>
</main>

<div x-init="$el.outerHTML = await loadPartialView('partial/modal.html')"></div>
<div x-init="$el.outerHTML = await loadPartialView('partial/notification.html')"></div>

<script type="module" src="js/index.js"></script>

</body>
</html>
