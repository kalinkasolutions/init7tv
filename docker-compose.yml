services:
  app:
    container_name: init7tv
    image: kalinkasolutions/init7tv:latest
    ports:
      - "7880:8080"
    restart: always
    volumes:
      - ./data:/var/srv
    environment:
      - ProxyAddress=10.10.0.20
      - Init7TvOptions__UseMultiCast=false
      - ASPNETCORE_HTTP_PORTS=8080
    # Multicast needs network_mode: host instead of the ports mapping above,
    # see the README.
